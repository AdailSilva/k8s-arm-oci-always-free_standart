---

kind: "PersistentVolumeClaim"
apiVersion: "v1"
metadata:
  name: portainer-pvc
  namespace: portainer  
  annotations:
    volume.alpha.kubernetes.io/storage-class: "generic"
  labels:
    io.portainer.kubernetes.application.stack: portainer-pvc
    app.kubernetes.io/name: portainer-pvc
    app.kubernetes.io/instance: portainer-pvc
    app.kubernetes.io/version: "ce-latest-ee-2.15.1"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "10Gi"
