# AppProject 00-plataforma — agrupa e restringe as Applications 'plataforma-*' no ArgoCD.
# O nome comeca pelo numero do repositorio: a lista de projetos da UI fica na ordem 00 -> 06.
# Aplicado uma vez a mao no bootstrap (o app-of-apps precisa dele) e depois mantido pelo app-of-apps.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: 00-plataforma
  namespace: argocd
  labels:
    adailsilva.com.br/repositorio: k8s-arm-oci-always-free_standart
    adailsilva.com.br/projeto: "plataforma"
  annotations:
    # Antes das Applications que o referenciam.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: "00 · Plataforma — infraestrutura compartilhada do cluster (metrics-server, health check UDP do NLB, Portainer CE)"
  sourceRepos:
    - https://github.com/AdailSilva/k8s-arm-oci-always-free_standart.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'kube-system'
    - server: https://kubernetes.default.svc
      namespace: 'oci-devops'
    - server: https://kubernetes.default.svc
      namespace: 'portainer'
  # Recursos de cluster permitidos. Namespace: exigido pelo CreateNamespace=true.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiregistration.k8s.io
      kind: APIService
