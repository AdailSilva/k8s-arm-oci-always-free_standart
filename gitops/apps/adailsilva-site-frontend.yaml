# Site institucional k8s.adailsilva.com.br
# Padrão de nome: <projeto>-<sistema>-<componente>  ·  AppProject 01-adailsilva  ·  ver gitops/PADRAO-ARGOCD.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adailsilva-site-frontend
  namespace: argocd
  labels:
    adailsilva.com.br/repositorio: k8s-arm-oci-always-free_standart
    adailsilva.com.br/projeto: "adailsilva"
    adailsilva.com.br/sistema: site
    adailsilva.com.br/componente: frontend
    adailsilva.com.br/implantacao: argocd
  annotations:
    link.argocd.argoproj.io/external-link: https://k8s.adailsilva.com.br
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: 01-adailsilva
  info:
    - name: Pasta
      value: 04.homepage/app_adailsilva_site_frontend/kubernetes
    - name: Implantação
      value: "Pipeline publica a imagem e grava o newTag; o ArgoCD aplica (automático, selfHeal)"
  source:
    repoURL: https://github.com/AdailSilva/k8s-arm-oci-always-free_standart.git
    targetRevision: master
    path: 04.homepage/app_adailsilva_site_frontend/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: adailsilva-site
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions:
      - ApplyOutOfSyncOnly=true
      # O namespace adailsilva-site e criado pelo pipeline (01.create__Namespace.yaml).
      # CreateNamespace cobre o caso do app-of-apps ser aplicado ANTES do primeiro
      # deploy: sem ele a sincronizacao falha ate o pipeline rodar.
      - CreateNamespace=true
  revisionHistoryLimit: 20
