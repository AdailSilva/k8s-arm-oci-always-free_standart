# Source: ingress-nginx/templates/controller-service.yaml
apiVersion: v1
kind: Service
metadata:
  labels:
    helm.sh/chart: ingress-nginx-4.0.10
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/version: 1.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: ingress-nginx
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  type: NodePort
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  # Portas publicadas pelo ingress-nginx. Cada porta daqui precisa de:
  #   - um item em servicos_nlb (inputs.tf da raiz): listener do NLB + Security List;
  #   - TCP/UDP fora do HTTP(S): uma entrada em tcp-services/udp-services (abaixo).
  ports:
    # --- HTTP/HTTPS: sites e sistemas (Ingress de cada aplicação)
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      appProtocol: http
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
      appProtocol: https
      nodePort: 30443
    # --- ChirpStack v3: gateways LoRaWAN (UDP) e MQTT com usuário e senha
    - name: proxied-udp-1700
      port: 1700
      targetPort: 1700
      protocol: UDP
      nodePort: 30700
    - name: proxied-tcp-1888
      port: 1888
      targetPort: 1888
      protocol: TCP
      nodePort: 30888
    # --- ChirpStack v4: gateways LoRaWAN (UDP) e MQTT com TLS
    - name: proxied-udp-1710
      port: 1710
      targetPort: 1710
      protocol: UDP
      nodePort: 30710
    - name: proxied-tcp-8883
      port: 8883
      targetPort: 8883
      protocol: TCP
      nodePort: 30883
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/component: controller

---

# Portas TCP repassadas pelo ingress-nginx: "<porta do Service>": "<namespace>/<service>:<porta>"
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-services
  namespace: ingress-nginx
data:
  # ChirpStack v3: MQTT (usuário e senha)
  "1888": "chirpstack-v3/chirpstack-v3-mosquitto-service:1888"
  # ChirpStack v4: MQTT com TLS
  "8883": "chirpstack-v4/chirpstack-v4-mosquitto-service:8883"

---

# Portas UDP repassadas pelo ingress-nginx: "<porta do Service>": "<namespace>/<service>:<porta>"
apiVersion: v1
kind: ConfigMap
metadata:
  name: udp-services
  namespace: ingress-nginx
data:
  # ChirpStack v3: Gateway Bridge (Semtech UDP Packet Forwarder)
  "1700": "chirpstack-v3/chirpstack-v3-gateway-bridge-service:1700"
  # ChirpStack v4: Gateway Bridge (Semtech UDP Packet Forwarder)
  "1710": "chirpstack-v4/chirpstack-v4-gateway-bridge-service:1710"

---

# Source: ingress-nginx/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    helm.sh/chart: ingress-nginx-4.0.10
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/version: 1.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/component: controller
  revisionHistoryLimit: 10
  minReadySeconds: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/instance: ingress-nginx
        app.kubernetes.io/component: controller
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: controller
          image: k8s.gcr.io/ingress-nginx/controller:v1.1.0@sha256:f766669fdcf3dc26347ed273a55e754b427eb4411ee075a53f30718b4499076a
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - /wait-shutdown
          args:
            - /nginx-ingress-controller

            - --election-id=ingress-controller-leader
            - --controller-class=k8s.io/ingress-nginx
            - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller

            - --tcp-services-configmap=$(POD_NAMESPACE)/tcp-services
            - --udp-services-configmap=$(POD_NAMESPACE)/udp-services

            - --validating-webhook=:8443
            - --validating-webhook-certificate=/usr/local/certificates/cert
            - --validating-webhook-key=/usr/local/certificates/key
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            runAsUser: 101
            allowPrivilegeEscalation: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_PRELOAD
              value: /usr/local/lib/libmimalloc.so
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: webhook
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: webhook-cert
              mountPath: /usr/local/certificates/
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 90Mi
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: ingress-nginx
      terminationGracePeriodSeconds: 300
      volumes:
        - name: webhook-cert
          secret:
            secretName: ingress-nginx-admission

